[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-franka-isaaclab"
version = "0.1.0"
description = "VLA Model Data Collection and Inference Toolkit for Franka on IsaacLab"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "VLA Franka IsaacLab Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
# Base dependencies shared across all use-cases.
# For environment-specific deps, see requirements-*.txt files.
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "h5py>=3.0.0",
    "torch>=2.0.0",
    "gymnasium>=0.28.0,<1.3.0",
    "tqdm>=4.60.0",
    "opencv-python>=4.8.0",
    "msgpack>=1.0.0",
    "pyzmq>=25.0.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
isaac = [
    "isaaclab>=0.48.5",
    "isaaclab-tasks>=0.11.8",
    "isaaclab-assets>=0.2.3",
    "isaaclab-mimic>=1.0.15",
    "lerobot==0.4.4",
    "transformers>=4.40.0",
]
gr00t = [
    "transformers>=4.45.0,<4.52.0",
    "torchvision>=0.15.0",
]
train = [
    "lerobot==0.4.4",
    "torchvision>=0.15.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/vla-franka-isaaclab"
Repository = "https://github.com/yourusername/vla-franka-isaaclab"
Issues = "https://github.com/yourusername/vla-franka-isaaclab/issues"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
